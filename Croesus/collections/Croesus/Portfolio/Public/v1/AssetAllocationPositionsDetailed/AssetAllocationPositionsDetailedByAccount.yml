docs: "# Summary\nRetrieves detailed asset allocation positions for a specific account.\n\
  \n## Description\n`min ref 2025-08 (90.51)`\n\n## Parameters\n\n- **accountId**\
  \ (path) : The unique identifier of the account for which asset allocation positions\
  \ are requested.\n- **requestedCurrency** (query) : The currency in which the asset\
  \ allocation position should be expressed.  This parameter is optional and can be\r\
  \n            null, in which case the default currency will be used.\n- **assetAllocationId**\
  \ (query) : The unique identifier of the asset allocation to retrieve.  This parameter\
  \ is optional and can be null,\r\n            in which case all asset allocations\
  \ may be retrieved."
