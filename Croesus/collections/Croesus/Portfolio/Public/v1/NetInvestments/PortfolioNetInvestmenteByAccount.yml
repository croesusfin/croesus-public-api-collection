docs: "# Summary\nRetrieves the net investment details for a specified account.\n\n\
  ## Description\n`min ref 2025-08 (90.51)`\r\n            This method validates the\
  \ incoming request and retrieves net investment details based\r\n            on\
  \ the specified criteria. The response includes details such as investment amounts,\
  \ returns, and other\r\n            relevant financial data.\n\n## Parameters\n\n\
  - **accountId** (path) : The unique identifier of the account for which net investment\
  \ details are requested.\n- **portfolioDate** (query) : The date to use for the\
  \ portfolio summary calculation\n- **considerManagementStartDate** (query) : If\
  \ false, start date will be account inception date."
