docs: "# Summary\nRetrieves the net investment details for a specific relationship\
  \ within a portfolio.\n\n## Description\n`min ref 2025-08 (90.51)`\r\n         \
  \   This method requires authorization to read portfolio data. Ensure the caller\
  \ has the\r\n            appropriate permissions.\n\n## Parameters\n\n- **relationshipId**\
  \ (path) : The unique identifier of the relationship for which net investment details\
  \ are requested. Must be a positive\r\n            integer.\n- **portfolioDate**\
  \ (query) : The date to use for the portfolio summary calculation\n- **considerManagementStartDate**\
  \ (query) : If false, start date will be account inception date."
