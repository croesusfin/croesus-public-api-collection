docs: "# Summary\nGet a list of transactions for a specific relationship id.\n\n##\
  \ Description\n`min ref 2025-12 (90.51)`\n\n## Parameters\n\n- **relationshipId**\
  \ (path) : The relationship id to retrieve the transactions\n- **dateType** (query)\
  \ : One of: Transaction, Settlement. Default : Transaction\n- **startDate** (query)\
  \ : Start date of the DateType choosen (yyyy-MM-dd).\n- **endDate** (query) : End\
  \ date of the DateType choosen (yyyy-MM-dd).\n- **symbols** (query) : A list of\
  \ Symbol (Maximum 50)\n- **transactionCurrency** (query) : The currency in which\
  \ the transaction was made\n- **typeCodeIds** (query) : Type of transaction\n- **transactionIds**\
  \ (query) : A list of Transactions ids (Maximum 50)\n- **sortingRules** (query)\
  \ : List of properties to sort. \\\r\nUse comma as delimiter and a - sign for descending\
  \ ( i.e. -TransactionDate ) \\\r\n*Available values*: ClientLongName, TransactionDate,\
  \ SettlementDate, AccountNumber, Symbol.\n- **after** (query) : The item id of the\
  \ first item to be returned in the page when moving forward. \\\r\nGet this value\
  \ from the field *Next* of your response\n- **before** (query) : The item id of\
  \ the last item to be returned in the page when moving backwards. \\\r\nGet this\
  \ value from the field *Previous* of your response\n- **pageLimit** (query) : The\
  \ maximun number of items a page should return"
