docs: "# Summary\nGet the breakdown of a selected portfolio in terms of asset allocations\
  \ and show the list of positions held in each asset class (or sub asset class) and\
  \ their basic information\n\n## Description\n`min ref 2025-08 (90.51)`\r\n     \
  \       This method validates the provided request and retrieves the asset allocation\r\
  \n            positions for the specified client using the portfolio service. If\
  \ the request is invalid, a Microsoft.AspNetCore.Mvc.BadRequestResult is returned.\n\
  \n## Parameters\n\n- **clientId** (path) : The unique identifier of the client whose\
  \ asset allocation positions are to be retrieved.\n- **requestedCurrency** (query)\
  \ : The currency in which the asset allocation position should be expressed.  This\
  \ parameter is optional and can be\r\n            null, in which case the default\
  \ currency will be used.\n- **assetAllocationId** (query) : The unique identifier\
  \ of the asset allocation to retrieve.  This parameter is optional and can be null,\r\
  \n            in which case all asset allocations may be retrieved."
