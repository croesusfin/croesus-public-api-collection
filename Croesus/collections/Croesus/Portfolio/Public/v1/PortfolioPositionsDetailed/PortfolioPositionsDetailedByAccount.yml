docs: '# Summary

  Get the portfolio positions detail for an account


  ## Parameters


  - **accountId** (path) : A Croesus id for the account

  - **requestedCurrency** (query) : The portfolio will be returned in this currency.
  The list of supported currencies follow the International Standard for currency
  codes (ISO 4217).

  - **sortOrder** (query) : Predefined Sorting Option: only one option at the time
