docs: "# Summary\nRetrieves the cumulated portfolio values as of a specified date\
  \ for a given relationship.\n\n## Description\n`min ref 2025-02 (90.48)`\n\n## Parameters\n\
  \n- **relationshipId** (path) : The unique identifier of the relationship for which\
  \ the portfolio values are requested. Must be a valid,\r\n            non-negative\
  \ integer.\n- **requestedCurrency** (query) : The currency in which the portfolio\
  \ will be returned. The list of supported currencies follows the International Standard\
  \ for currency codes (ISO 4217).\n- **portfolioDate** (query) : The date to use\
  \ for the portfolio calculation"
