docs: "# Summary\nRetrieves the portfolio detailed performance data for a specific\
  \ client.\n\n## Parameters\n\n- **calculationMethod** (query) : Choice of One or\
  \ multiple: NetROI, GrossROI, NetIRR\n- **cumulativePeriods** (query) : List of\
  \ cumulative period to get the performance.\r\nThe period represent months : 3,\
  \ 6, 9 etc...\r\nCan not be used with FixedPeriods\r\nDefault: YTD (Year To Date)\n\
  - **contextIds** (query) : \n- **fixedPeriods** (query) : List of fixed periods\
  \ to get the performance.\r\nThe period represent year : 2010, 2009, 2008 etc...\r\
  \nCan not be used with CumulativePeriods\r\nDefault: YTD (Year To Date)\n- **requestedCurrency**\
  \ (query) : Currency of the performance. Default is the currency of the account.\n\
  - **considerManagementStartDate** (query) : Gets or sets a value indicating whether\
  \ the Croesus pref which allows all calculations to begin from a certain date set\
  \ in the UI is used or not.\r\noperations.\n- **includeInflowOutflowRevenue** (query)\
  \ : Gets or sets a value indicating whether to include inflow, outflow, and revenue\
  \ in the performance calculation.\n- **includeNonAnnualizedValues** (query) : Gets\
  \ or sets a value indicating whether to include non-annualized values in the performance\
  \ calculation.\n- **includeStandardDeviation** (query) : Gets or sets a value indicating\
  \ whether to include standard deviation values in the performance calculation.\n\
  - **includeSharpeRatio** (query) : Gets or sets a value indicating whether to include\
  \ Sharped Index Ratio values in the performance calculation."
