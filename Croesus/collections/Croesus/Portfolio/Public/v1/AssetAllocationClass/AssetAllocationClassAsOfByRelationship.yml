docs: '# Summary

  Get the portfolio asset allocation classes for a relationship as of a specifique
  date


  ## Description

  `min ref 2025-02 (90.48)`


  ## Parameters


  - **relationshipId** (path) : A Croesus id for the relationship

  - **requestedCurrency** (query) : The currency in which the portfolio will be returned.
  The list of supported currencies follows the International Standard for currency
  codes (ISO 4217).

  - **includeFundAllocation** (query) : Indicates whether to include the fund allocations

  - **portfolioDate** (query) : The date to use for the portfolio calculation'
