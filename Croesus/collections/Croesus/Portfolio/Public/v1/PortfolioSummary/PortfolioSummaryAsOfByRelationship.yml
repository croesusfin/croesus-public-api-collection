docs: '# Summary

  Get the portfolio summary for an relationship as of a specifique date


  ## Description

  `min ref 2024-12 (90.47)`


  ## Parameters


  - **relationshipId** (path) : A Croesus id for the relationship

  - **requestedCurrency** (query) : The portfolio will be returned in this currency.
  The list of supported currencies follow the International Standard for currency
  codes (ISO 4217).

  - **portfolioDate** (query) : The date to use for the portfolio summary calculation
  (As Of), Note: If the date selected is a weekend, the API will return the previous
  Friday''s data.'
