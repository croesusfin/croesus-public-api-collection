docs: "# Summary\nGet all the notes base on the filters\n\n## Description\n`min ref\
  \ 2024-08 (90.45)`\n\n## Parameters\n\n- **contextType** (path) : The context type\
  \ of the context id passed as parameter.\n- **contextId** (path) : The api will\
  \ search only for the notes owned by this context id\n- **noteIds** (query) : The\
  \ list of note ids\n- **comment** (query) : The comment of the note\n- **firstName**\
  \ (query) : First name of the creator of the note\n- **lastName** (query) : Last\
  \ name of the creator of the note\n- **dateFrom** (query) : Starting date to filter\
  \ the notes\n- **dateTo** (query) : Ending data to filter the notes\n- **isReviewed**\
  \ (query) : Indicates whether the note is reviewed or not\n- **after** (query) :\
  \ The item id of the first item to be returned in the page when moving forward.\
  \ \\\r\nGet this value from the field *Next* of your response\n- **before** (query)\
  \ : The item id of the last item to be returned in the page when moving backwards.\
  \ \\\r\nGet this value from the field *Previous* of your response\n- **pageLimit**\
  \ (query) : The maximun number of items a page should return\n- **sortingRules**\
  \ (query) : List of properties to sort. \\\r\nUse comma as delimiter and a - sign\
  \ for descending ( i.e. -Name ) \\\r\n*Available values*: Name, DateUploaded, UploadedBy"
