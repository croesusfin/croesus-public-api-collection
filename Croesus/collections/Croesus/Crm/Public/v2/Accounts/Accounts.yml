docs: "# Summary\nGet a list of accounts based in the filters sent\n\n## Description\n\
  `min ref 2024-10 (90.46)`\n\n## Parameters\n\n- **accountIds** (query) : A list\
  \ of account ids (Maximum 50)\n- **accountNumbers** (query) : A list of account\
  \ numbers (Maximum 50)\n- **clientIds** (query) : A list of client ids (Maximum\
  \ 50)\n- **clientNumbers** (query) : A list of client numbers (Maximum 50)\n- **investmentAdvisorCodes**\
  \ (query) : A list of advisors codes (Maximum 51)\n- **accountCurrency** (query)\
  \ : The account currency (CAD or USD)\n- **requestedCurrency** (query) : The Currency\
  \ requested for display (CAD, USD etc)\n- **shortName** (query) : The Short Name\n\
  - **totalValueGT** (query) : Minimum total value required\n- **totalValueLT** (query)\
  \ : Maximum total value required\n- **typeDescription** (query) : The type of account\
  \ (Cash, Life Annuity)\n- **profile** (query) : Profile filter where the profile\
  \ name is the parameter key e.g. Profile.BrokerAccountNumber=800006-GT\n- **after**\
  \ (query) : The item id of the first item to be returned in the page when moving\
  \ forward. \\\r\nGet this value from the field *Next* of your response\n- **before**\
  \ (query) : The item id of the last item to be returned in the page when moving\
  \ backwards. \\\r\nGet this value from the field *Previous* of your response\n-\
  \ **pageLimit** (query) : The maximun number of items a page should return\n- **sortingRules**\
  \ (query) : List of properties to sort. \\\r\nUse comma as delimiter and a - sign\
  \ for descending ( i.e. -ShortName ) \\\r\n*Available values*: ShortName, AccountId,\
  \ AccountNumber, ClientId, ClientNumber, InvestmentAdvisorCode, AccountCurrency"
