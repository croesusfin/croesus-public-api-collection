docs: "# Summary\nGet a list of relationships by account id\n\n## Description\n`min\
  \ ref 2025-08 (90.50)`\n\n## Parameters\n\n- **accountId** (path) : The account\
  \ id to search the relationships\n- **sortingRules** (query) : List of properties\
  \ to sort. \\\r\nUse comma as delimiter and a - sign for descending ( i.e. -LongName\
  \ ) \\\r\n*Available values*: LongName, Number, InvestmentAdvisorCode, RelationshipCurrency,\
  \ RelationshipTypeDescription\n- **requestedCurrency** (query) : The Currency requested\
  \ for display\n- **after** (query) : The item id of the first item to be returned\
  \ in the page when moving forward. \\\r\nGet this value from the field *Next* of\
  \ your response\n- **before** (query) : The item id of the last item to be returned\
  \ in the page when moving backwards. \\\r\nGet this value from the field *Previous*\
  \ of your response\n- **pageLimit** (query) : The maximun number of items a page\
  \ should return"
