docs: "# Summary\nGet a list of simplifid clients based on the filters sent\n\n##\
  \ Description\n`min ref 2025-08 (90.50)`\n\n## Parameters\n\n- **clientIds** (query)\
  \ : A list of client ids (Maximum 50)\n- **clientNumbers** (query) : A list of client\
  \ numbers (Maximum 50)\n- **investmentAdvisorCodes** (query) : A list of advisors\
  \ codes (Maximum 50)\n- **clientCurrency** (query) : The Client Currency\n- **shortName**\
  \ (query) : The Short Name\n- **after** (query) : The item id of the first item\
  \ to be returned in the page when moving forward. \\\r\nGet this value from the\
  \ field *Next* of your response\n- **before** (query) : The item id of the last\
  \ item to be returned in the page when moving backwards. \\\r\nGet this value from\
  \ the field *Previous* of your response\n- **pageLimit** (query) : The maximun number\
  \ of items a page should return\n- **sortingRules** (query) : List of properties\
  \ to sort. \\\r\nUse comma as delimiter and a - sign for descending ( i.e. -ShortName\
  \ ) \\\r\n*Available values*: ShortName, ClientId, ClientNumber, InvestmentAdvisorCode"
