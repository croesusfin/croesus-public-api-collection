docs: '# Summary

  Retrieves a list of SCIM users with optional filtering, sorting, and pagination.


  ## Parameters


  - **filter** (query) : SCIM filter expression (e.g., ''userName eq "john.doe"'')

  - **attributes** (query) : Comma-separated list of attributes to include in response

  - **excludedAttributes** (query) : Comma-separated list of attributes to exclude
  from response

  - **sortBy** (query) : Attribute name to sort by (e.g., ''userName'', ''displayName'')

  - **sortOrder** (query) : Sort order: ''ascending'' or ''descending''

  - **startIndex** (query) : 1-based start index for pagination (default: 1)

  - **count** (query) : Number of resources to return per page (default: 20)'
