docs: "# Summary\nGet the Distributions Histories for a given security id.\n\n## Description\n\
  `min ref 2026-08 (90.53)`\n\n## Parameters\n\n- **securityId** (path) : A croesus\
  \ id for the security\n- **startDate** (query) : Start date of the DateType chosen\
  \ (yyyy-MM-dd).\n- **endDate** (query) : End date of the DateType chosen (yyyy-MM-dd).\n\
  - **dateType** (query) : \n- **sortingRules** (query) : List of properties to sort.\
  \ \\\r\nUse comma as delimiter and a - sign for descending ( i.e. -RecordDate )\
  \ \\\r\n*Available values*: RecordDate, ExDividendDate, PaymentDate, DistributionTotal,\
  \ CapitalGains, DividendAmount, Interest, ReturnOfCapital, ForeignDividend"
